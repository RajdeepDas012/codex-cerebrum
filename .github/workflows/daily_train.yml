name: 🧠 Gemini Coding Brain — Auto Learn

on:
  schedule:
    - cron: "0 * * * *"    # once every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    name: Learn & Commit Loop
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔁 Run every 3 minutes — 20 times per hour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name  "YOUR NAME HERE"
          git config user.email "YOUR_GITHUB_EMAIL@gmail.com"

          # 20 iterations × 3 min sleep = 57 min total
          for i in $(seq 1 20); do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔁 Iteration $i of 20"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Pull latest to avoid conflicts
            git pull --rebase origin main || true

            # Run Gemini agent
            python agent/agent.py

            # Commit
            git add -A
            if git diff --staged --quiet; then
              echo "⏭️  No changes"
            else
              TOPIC=$(python -c "
import json
try:
    with open('data/knowledge_base.json') as f:
        d = json.load(f)
    e = d['entries'][-1]
    print(f\"{e.get('topic','?')} [{e.get('category','?')}]\")
except:
    print('update')
" 2>/dev/null || echo "update")

              RUN=$(python -c "
import json
try:
    with open('data/knowledge_base.json') as f:
        d = json.load(f)
    print(d['meta']['total_runs'])
except:
    print('?')
" 2>/dev/null || echo "?")

              git commit -m "🧠 Run #${RUN}: ${TOPIC}"
              git push
              echo "✅ Committed Run #${RUN}"
            fi

            # Wait 3 minutes before next (skip last)
            if [ $i -lt 20 ]; then
              echo "⏳ Waiting 3 minutes..."
              sleep 180
            fi
          done

          echo ""
          echo "🎉 Hour done — 20 commits!"
