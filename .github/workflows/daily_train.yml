name: 🧠 Gemini Coding Brain — Auto Learn

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    name: Learn & Commit Loop
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📝 Create helper scripts
        run: |
          cat > get_topic.py << 'PYEOF'
          import json
          try:
              with open('data/knowledge_base.json') as f:
                  d = json.load(f)
              e = d['entries'][-1]
              topic = e.get('topic', 'unknown')
              cat = e.get('category', '?')
              print(topic + ' [' + cat + ']')
          except Exception:
              print('update')
          PYEOF

          cat > get_run.py << 'PYEOF'
          import json
          try:
              with open('data/knowledge_base.json') as f:
                  d = json.load(f)
              print(d.get('meta', {}).get('total_runs', '?'))
          except Exception:
              print('?')
          PYEOF

      - name: 🔁 Run every 3 minutes — 20 times per hour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name  "YOUR NAME HERE"
          git config user.email "YOUR_GITHUB_EMAIL@gmail.com"

          for i in $(seq 1 20); do
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔁 Iteration $i of 20"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            git pull --rebase origin main || true

            python agent/agent.py

            git add -A

            if git diff --staged --quiet; then
              echo "⏭️  No changes"
            else
              TOPIC=$(python get_topic.py)
              RUN=$(python get_run.py)
              git commit -m "🧠 Run #${RUN}: ${TOPIC}"
              git push
              echo "✅ Committed Run #${RUN}: ${TOPIC}"
            fi

            if [ $i -lt 20 ]; then
              echo "⏳ Waiting 3 minutes..."
              sleep 180
            fi
          done

          echo "🎉 Hour done — 20 commits!"
