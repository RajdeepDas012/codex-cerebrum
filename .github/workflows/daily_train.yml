name: 🧠 Gemini Coding Brain — Auto Learn

# ── Triggers ──────────────────────────────────────────────────
on:
  schedule:
    - cron: "0 * * * *"     # every hour at :00  → 24 runs/day
    - cron: "20 * * * *"    # every hour at :20  → 24 runs/day
    - cron: "40 * * * *"    # every hour at :40  → 24 runs/day
    #                         total = 72 commits/day ✅
  workflow_dispatch:          # manual trigger from GitHub UI

# ── Permissions ───────────────────────────────────────────────
permissions:
  contents: write             # needed to commit back to repo

# ── Job ───────────────────────────────────────────────────────
jobs:
  learn:
    name: Learn & Commit
    runs-on: ubuntu-latest
    timeout-minutes: 10       # fail fast if something hangs

    steps:
      # 1. Get the code
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1      # shallow clone = faster

      # 2. Python setup
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the Gemini agent
      - name: 🤖 Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent/agent.py

      # 5. Commit with YOUR email so it counts for green streak
      - name: 💾 Commit to YOUR streak
        run: |
          # ✅ IMPORTANT: Change these to your real GitHub name and email
          # Your GitHub email = Settings → Emails → Primary email
          git config user.name  "Rajdeep Das"
          git config user.email "rajdeepdas007007@gmail.com"

          git add -A

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "⏭️  No changes to commit"
          else
            # Get topic of what was just learned
            TOPIC=$(python -c "
          import json, sys
          try:
              with open('data/knowledge_base.json') as f:
                  d = json.load(f)
              entries = d.get('entries', [])
              if entries:
                  e = entries[-1]
                  print(f\"{e.get('topic','unknown')} [{e.get('category','?')}]\")
              else:
                  print('initial entry')
          except Exception as ex:
              print('update')
          " 2>/dev/null || echo "update")

            # Get current run number
            RUN=$(python -c "
          import json
          try:
              with open('data/knowledge_base.json') as f:
                  d = json.load(f)
              print(d.get('meta',{}).get('total_runs', '?'))
          except:
              print('?')
          " 2>/dev/null || echo "?")
          
            git commit -m "🧠 Run #${RUN}: ${TOPIC}"
            git pull --rebase origin main
            git push
            echo "✅ Committed Run #${RUN}: ${TOPIC}"
          fi
