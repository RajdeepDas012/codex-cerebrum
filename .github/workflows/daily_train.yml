name: Gemini Coding Brain - Auto Learn

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learn:
    name: Learn and Commit Loop
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write helper scripts to tmp
        run: |
          python3 << 'PYEOF'
          topic_script = (
              'import json\n'
              'try:\n'
              '    d = json.load(open("data/knowledge_base.json"))\n'
              '    e = d["entries"][-1]\n'
              '    print(e.get("topic","unknown") + " [" + e.get("category","?") + "]")\n'
              'except Exception:\n'
              '    print("update")\n'
          )
          run_script = (
              'import json\n'
              'try:\n'
              '    d = json.load(open("data/knowledge_base.json"))\n'
              '    print(str(d.get("meta",{}).get("total_runs","?")))\n'
              'except Exception:\n'
              '    print("?")\n'
          )
          open('/tmp/get_topic.py', 'w').write(topic_script)
          open('/tmp/get_run.py', 'w').write(run_script)
          print('Helper scripts ready in /tmp')
          PYEOF

      - name: Run and commit every 3 minutes - 15 times per hour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name  "YOUR NAME HERE"
          git config user.email "YOUR_GITHUB_EMAIL@gmail.com"

          for i in $(seq 1 15); do
            echo ""
            echo "==============================="
            echo "Iteration $i of 15"
            echo "==============================="

            git pull --rebase origin main || true

            echo "Running Gemini agent..."
            python3 agent/agent.py
            EXIT_CODE=$?
            echo "Agent exit code: $EXIT_CODE"

            if [ $EXIT_CODE -eq 2 ]; then
              echo "API daily limit hit - stopping loop"
              echo "Will resume next hour when quota resets"
              break
            fi

            if [ $EXIT_CODE -ne 0 ]; then
              echo "Agent error - skipping this commit"
              if [ $i -lt 15 ]; then
                sleep 180
              fi
              continue
            fi

            echo "Files changed:"
            git status --short

            git add data/ export/ README.md || true

            STAGED=$(git diff --cached --name-only)

            if [ -z "$STAGED" ]; then
              echo "Nothing staged - skipping commit"
            else
              TOPIC=$(python3 /tmp/get_topic.py)
              RUN=$(python3 /tmp/get_run.py)
              git commit -m "Run ${RUN}: ${TOPIC}"
              git push origin main
              echo "Committed: Run ${RUN} - ${TOPIC}"
            fi

            if [ $i -lt 15 ]; then
              echo "Waiting 3 minutes before next run..."
              sleep 180
            fi

          done

          echo "Done - all 15 iterations complete!"
